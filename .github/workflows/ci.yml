name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VoyageHub-Backend/VoyageHub.slnx

      - name: Build in Release
        run: dotnet build VoyageHub-Backend/VoyageHub.slnx -c Release --no-restore

      - name: Run unit tests
        run: dotnet test VoyageHub-Backend/VoyageHub.slnx -c Release --no-build

  frontend:
    name: Frontend Build & Test (Angular 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: VoyageHub-Frontend/package-lock.json

      - name: Install dependencies
        working-directory: VoyageHub-Frontend
        run: npm ci

      - name: Run unit tests (non-watch)
        working-directory: VoyageHub-Frontend
        run: npm test -- --no-watch

      - name: Build production application
        working-directory: VoyageHub-Frontend
        run: npm run build
