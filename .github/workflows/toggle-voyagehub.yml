name: Toggle VoyageHub API

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Start or stop voyagehub-api"
        required: true
        type: choice
        options:
          - stop
          - start

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start or Stop Web App
        run: |
          if [ "${{ inputs.action }}" = "stop" ]; then
            az webapp stop --name voyagehub-api --resource-group voyagehub-rg
          else
            az webapp start --name voyagehub-api --resource-group voyagehub-rg
          fi
          az webapp show --name voyagehub-api --resource-group voyagehub-rg --query "{name:name,state:state}" -o table
