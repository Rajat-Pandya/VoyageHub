name: Toggle VoyageHub API

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Start or stop voyagehub-api"
        required: true
        type: choice
        options:
          - stop
          - start

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Set Web App State
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          ACTION: ${{ inputs.action }}
          APP_NAME: voyagehub-api
          SCM_HOST: voyagehub-api-f7dzcjbgdmb5e6gv.scm.centralindia-01.azurewebsites.net
        run: |
          set -e

          # Extract publish credentials from the publish profile XML
          USER_NAME=$(echo "$PUBLISH_PROFILE" | python3 -c "import sys, xml.etree.ElementTree as ET; root = ET.fromstring(sys.stdin.read()); p = root.find(\".//publishProfile[@publishMethod='MSDeploy']\"); print(p.attrib.get('userName', ''))")
          USER_PWD=$(echo "$PUBLISH_PROFILE" | python3 -c "import sys, xml.etree.ElementTree as ET; root = ET.fromstring(sys.stdin.read()); p = root.find(\".//publishProfile[@publishMethod='MSDeploy']\"); print(p.attrib.get('userPWD', ''))")

          if [ -z "$USER_NAME" ] || [ -z "$USER_PWD" ]; then
            echo "Could not parse MSDeploy credentials from AZURE_WEBAPP_PUBLISH_PROFILE"
            exit 1
          fi

          if [ "$ACTION" = "stop" ]; then
            TARGET_STATE="Stopped"
          else
            TARGET_STATE="Running"
          fi

          curl -fsSL -u "$USER_NAME:$USER_PWD" \
            -X POST "https://$SCM_HOST/api/webapp" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"$TARGET_STATE\"}"

          echo ""
          echo "Requested state '$TARGET_STATE' for $APP_NAME."
