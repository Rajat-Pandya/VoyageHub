<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">An Angular SPA client sends HTTPS/JWT requests to an ASP.NET Core Web API, which is internally layered into Controllers, Services, and Repositories, which in turn talk to a SQL Server database via EF Core.</desc>
