<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<h2 class="sr-only">Entity-relationship diagram for the Travel Management System database</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: false,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: '#0F6E56',
    textColor: '#04342C',
    primaryColor: '#9FE1CB',
    primaryTextColor: '#04342C',
    primaryBorderColor: '#0F6E56',
    secondaryColor: '#5DCAA5',
    tertiaryColor: '#E1F5EE',
    attributeBackgroundColorOdd: '#FFFFFF',
    attributeBackgroundColorEven: '#E1F5EE',
  },
});
const src = `erDiagram
  DEPARTMENTS ||--o{ USERS : employs
  USERS ||--o{ USERS : manages
  USERS ||--o{ TRAVEL_REQUESTS : submits
  TRAVEL_REQUESTS ||--o{ APPROVAL_STEPS : has
  USERS ||--o{ APPROVAL_STEPS : acts_on
  TRAVEL_REQUESTS ||--o{ ITINERARY_SEGMENTS : includes
  TRAVEL_REQUESTS ||--o{ STAYS : includes
  TRAVEL_REQUESTS ||--o{ EXPENSES : has
  TRAVEL_REQUESTS ||--o{ AUDIT_LOGS : logs
  DEPARTMENTS ||--o{ TRAVEL_POLICIES : defines

  DEPARTMENTS {
    uuid id PK
    string name
  }
  USERS {
    uuid id PK
    string name
    string email
    string role
    uuid department_id FK
    uuid manager_id FK
  }
  TRAVEL_REQUESTS {
    uuid id PK
    uuid employee_id FK
    string destination
    date start_date
    date end_date
    string purpose
    decimal estimated_budget
    string status
  }
  APPROVAL_STEPS {
    uuid id PK
    uuid request_id FK
    uuid approver_id FK
    string level
    string status
    string comment
  }
  ITINERARY_SEGMENTS {
    uuid id PK
    uuid request_id FK
    string mode
    string origin
    string destination
    datetime departure_time
  }
  STAYS {
    uuid id PK
    uuid request_id FK
    string hotel_name
    date check_in
    date check_out
  }
  EXPENSES {
    uuid id PK
    uuid request_id FK
    string category
    decimal amount
    string proof_path
    string status
  }
  AUDIT_LOGS {
    uuid id PK
    string entity_type
    uuid entity_id
    string action
    uuid actor_id FK
    datetime timestamp
  }
  TRAVEL_POLICIES {
    uuid id PK
    uuid department_id FK
    decimal max_budget
    string allowed_class
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
