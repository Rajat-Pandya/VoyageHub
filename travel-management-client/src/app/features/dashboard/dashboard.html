<!-- src/app/features/dashboard/dashboard.component.html -->
<h2>Dashboard</h2>

<section class="summary-cards">
    <mat-card><mat-card-content>
            <span class="card-label">Draft Requests</span>
            <span class="card-value">2</span>
        </mat-card-content></mat-card>

    <mat-card><mat-card-content>
            <span class="card-label">Pending Approval</span>
            <span class="card-value">1</span>
        </mat-card-content></mat-card>

    <mat-card><mat-card-content>
            <span class="card-label">Upcoming Trips</span>
            <span class="card-value">3</span>
        </mat-card-content></mat-card>

    <mat-card><mat-card-content>
            <span class="card-label">Reimbursement Status</span>
            <span class="card-value">₹4,200 pending</span>
        </mat-card-content></mat-card>
</section>

<section class="recent-requests">
    <div class="section-header">
        <h3>Recent Requests</h3>
        <a mat-raised-button color="primary" routerLink="/requests/new">+ New Request</a>
    </div>

    <div class="table-container">
        <table mat-table [dataSource]="recentRequests">
            <ng-container matColumnDef="destination">
                <th mat-header-cell *matHeaderCellDef>Destination</th>
                <td mat-cell *matCellDef="let r">{{ r.destination }}</td>
            </ng-container>

            <ng-container matColumnDef="dates">
                <th mat-header-cell *matHeaderCellDef>Dates</th>
                <td mat-cell *matCellDef="let r">{{ r.dates }}</td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let r">
                    <mat-chip [class]="'status-' + r.status.toLowerCase().replace(' ', '-')">{{ r.status }}</mat-chip>
                </td>
            </ng-container>

            <ng-container matColumnDef="submitted">
                <th mat-header-cell *matHeaderCellDef>Submitted</th>
                <td mat-cell *matCellDef="let r">{{ r.submitted }}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</section>
