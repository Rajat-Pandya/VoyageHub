<!-- src/app/features/travel-requests/request-list/request-list.component.html -->
<div class="page-header">
    <h2>My Requests</h2>
    <a mat-raised-button color="primary" routerLink="/requests/new">+ New Request</a>
</div>

<div class="filters">
    <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select>
            <mat-option value="all">All Statuses</mat-option>
            <mat-option value="draft">Draft</mat-option>
            <mat-option value="submitted">Submitted</mat-option>
            <mat-option value="rejected">Rejected</mat-option>
        </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>From</mat-label>
        <input matInput title="formPicker" [matDatepicker]="fromPicker">
        <mat-datepicker-toggle matIconSuffix [for]="fromPicker"></mat-datepicker-toggle>
        <mat-datepicker #fromPicker></mat-datepicker>
    </mat-form-field>
</div>

<div class="table-container">
    <table mat-table [dataSource]="requests">
        <ng-container matColumnDef="destination">
            <th mat-header-cell *matHeaderCellDef>Destination</th>
            <td mat-cell *matCellDef="let r">{{ r.destination }}</td>
        </ng-container>

        <ng-container matColumnDef="dates">
            <th mat-header-cell *matHeaderCellDef>Dates</th>
            <td mat-cell *matCellDef="let r">{{ r.dates }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let r">
                <mat-chip [class]="'status-' + r.status.toLowerCase().replace(' ', '-')">{{ r.status }}</mat-chip>
            </td>
        </ng-container>

        <ng-container matColumnDef="submitted">
            <th mat-header-cell *matHeaderCellDef>Submitted</th>
            <td mat-cell *matCellDef="let r">{{ r.submitted }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let r">
                <a mat-button [routerLink]="['/requests', r.id]">View</a>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
