<div class="page-header">
  <div>
    <h2>Approvals Queue</h2>
    <p class="subtitle">Review and authorize travel requests and expense reimbursements.</p>
  </div>
</div>

<div class="table-container">
  <table mat-table [dataSource]="pendingApprovals">
    <ng-container matColumnDef="employee">
      <th mat-header-cell *matHeaderCellDef>Employee</th>
      <td mat-cell *matCellDef="let a">
        <strong>{{ a.employee }}</strong>
      </td>
    </ng-container>

    <ng-container matColumnDef="destination">
      <th mat-header-cell *matHeaderCellDef>Destination</th>
      <td mat-cell *matCellDef="let a">{{ a.destination }}</td>
    </ng-container>

    <ng-container matColumnDef="dates">
      <th mat-header-cell *matHeaderCellDef>Dates</th>
      <td mat-cell *matCellDef="let a">{{ a.dates }}</td>
    </ng-container>

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>Amount</th>
      <td mat-cell *matCellDef="let a">{{ a.amount }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let a">
        <mat-chip [class]="'status-' + a.status.toLowerCase().replace(' ', '-')">{{ a.status }}</mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let a">
        <div class="action-buttons">
          <a mat-button [routerLink]="['/requests', a.id]">Review</a>
          <button mat-stroked-button color="primary">Approve</button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
